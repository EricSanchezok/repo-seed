<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="l0g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#132a44"/><stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="l1g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e2a44"/><stop offset="1" stop-color="#243356"/>
    </linearGradient>
    <linearGradient id="l2g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#242144"/><stop offset="1" stop-color="#2c2557"/>
    </linearGradient>
    <linearGradient id="l3g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2c44"/><stop offset="1" stop-color="#21395c"/>
    </linearGradient>
    <linearGradient id="l4g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a3f"/><stop offset="1" stop-color="#33334d"/>
    </linearGradient>
    <linearGradient id="upg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#bg2)"/>

  <text x="600" y="54" font-size="32" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">A seed that keeps governing</text>
  <text x="600" y="84" font-size="18" fill="#94a3b8" text-anchor="middle">five layers + an upgrade channel — mechanical, not aspirational</text>

  <!-- L0 -->
  <rect x="80" y="112" width="1040" height="70" rx="14" fill="url(#l0g)" stroke="#2d5a8a" stroke-width="1.5"/>
  <rect x="104" y="126" width="86" height="42" rx="10" fill="#16324f"/>
  <text x="147" y="153" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">L0</text>
  <text x="214" y="143" font-size="19" font-weight="700" fill="#e2e8f0">Resident instructions</text>
  <text x="214" y="166" font-size="15.5" fill="#94a3b8">AGENTS.md (≤ 100 lines) + CLAUDE.md via @AGENTS.md import — the standing orders every session sees</text>
  <text x="1066" y="154" font-size="16" fill="#64748b" text-anchor="end" font-family="monospace">AGENTS.md</text>

  <!-- L1 -->
  <rect x="80" y="196" width="1040" height="70" rx="14" fill="url(#l1g)" stroke="#3b5b8a" stroke-width="1.5"/>
  <rect x="104" y="210" width="86" height="42" rx="10" fill="#243356"/>
  <text x="147" y="237" font-size="20" font-weight="800" fill="#34d399" text-anchor="middle">L1</text>
  <text x="214" y="227" font-size="19" font-weight="700" fill="#e2e8f0">Deterministic gates</text>
  <text x="214" y="250" font-size="15.5" fill="#94a3b8">verify-decisions · verify-doc-links · verify-placeholders · verify-manifest · whitespace, enforced by a pre-commit hook</text>
  <text x="1066" y="238" font-size="16" fill="#64748b" text-anchor="end" font-family="monospace">hooks/</text>

  <!-- L2 -->
  <rect x="80" y="280" width="1040" height="70" rx="14" fill="url(#l2g)" stroke="#5b4a9a" stroke-width="1.5"/>
  <rect x="104" y="294" width="86" height="42" rx="10" fill="#2c2557"/>
  <text x="147" y="321" font-size="20" font-weight="800" fill="#a78bfa" text-anchor="middle">L2</text>
  <text x="214" y="311" font-size="19" font-weight="700" fill="#e2e8f0">Unified decision log</text>
  <text x="214" y="334" font-size="15.5" fill="#94a3b8">MADR records + Class extension — Proposed → Accepted → Superseded by NNNN; never rewritten</text>
  <text x="1066" y="322" font-size="16" fill="#64748b" text-anchor="end" font-family="monospace">docs/decisions/</text>

  <!-- L3 -->
  <rect x="80" y="364" width="1040" height="70" rx="14" fill="url(#l3g)" stroke="#2d6a8a" stroke-width="1.5"/>
  <rect x="104" y="378" width="86" height="42" rx="10" fill="#21395c"/>
  <text x="147" y="405" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle">L3</text>
  <text x="214" y="395" font-size="19" font-weight="700" fill="#e2e8f0">In-repo skills</text>
  <text x="214" y="418" font-size="15.5" fill="#94a3b8">repo-review (instantiated per project) · repo-decisions — procedures live where agents find them</text>
  <text x="1066" y="406" font-size="16" fill="#64748b" text-anchor="end" font-family="monospace">.agents/skills/</text>

  <!-- L4 -->
  <rect x="80" y="448" width="1040" height="70" rx="14" fill="url(#l4g)" stroke="#5b5b8a" stroke-width="1.5"/>
  <rect x="104" y="462" width="86" height="42" rx="10" fill="#33334d"/>
  <text x="147" y="489" font-size="20" font-weight="800" fill="#f472b6" text-anchor="middle">L4</text>
  <text x="214" y="479" font-size="19" font-weight="700" fill="#e2e8f0">Process memory</text>
  <text x="214" y="502" font-size="15.5" fill="#94a3b8">testing policy · postmortems · PR template — lessons outlive the session that learned them</text>
  <text x="1066" y="490" font-size="16" fill="#64748b" text-anchor="end" font-family="monospace">docs/</text>

  <!-- upgrade channel bar -->
  <rect x="300" y="530" width="600" height="18" rx="9" fill="url(#upg)"/>
  <text x="600" y="556" font-size="14" fill="#64748b" text-anchor="middle" font-weight="600" letter-spacing="1">UPGRADE CHANNEL — re-run repo-seed; your edits always survive</text>
</svg>
