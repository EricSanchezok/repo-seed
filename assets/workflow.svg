<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="stepg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#101f33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg3)"/>
  <text x="600" y="52" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">Seed a repo in five steps</text>

  <!-- step 1 -->
  <g>
    <rect x="52" y="86" width="196" height="150" rx="16" fill="url(#stepg)" stroke="#2d5a8a" stroke-width="1.5"/>
    <circle cx="150" cy="124" r="24" fill="#132a44" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="131" font-size="22" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="150" y="180" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="middle">Analyze</text>
    <text x="150" y="204" font-size="14" fill="#94a3b8" text-anchor="middle">stack · conflicts · git state</text>
    <text x="150" y="222" font-size="13.5" fill="#64748b" text-anchor="middle">read-only · never touches .env</text>
  </g>

  <path d="M258 161 L 302 161" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arr3)"/>

  <!-- step 2 -->
  <g>
    <rect x="312" y="86" width="196" height="150" rx="16" fill="url(#stepg)" stroke="#2d5a8a" stroke-width="1.5"/>
    <circle cx="410" cy="124" r="24" fill="#132a44" stroke="#a78bfa" stroke-width="2"/>
    <text x="410" y="131" font-size="22" font-weight="800" fill="#a78bfa" text-anchor="middle">2</text>
    <text x="410" y="180" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="middle">Interview</text>
    <text x="410" y="204" font-size="14" fill="#94a3b8" text-anchor="middle">license · commands · review lines</text>
    <text x="410" y="222" font-size="13.5" fill="#64748b" text-anchor="middle">every question has a default</text>
  </g>

  <path d="M518 161 L 562 161" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arr3)"/>

  <!-- step 3 -->
  <g>
    <rect x="572" y="86" width="196" height="150" rx="16" fill="url(#stepg)" stroke="#34d399" stroke-width="2"/>
    <circle cx="670" cy="124" r="24" fill="#132a44" stroke="#34d399" stroke-width="2"/>
    <text x="670" y="131" font-size="22" font-weight="800" fill="#34d399" text-anchor="middle">3</text>
    <text x="670" y="180" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="middle">Scaffold</text>
    <text x="670" y="204" font-size="14" fill="#94a3b8" text-anchor="middle">skeleton · manifest · hooks</text>
    <text x="670" y="222" font-size="13.5" fill="#64748b" text-anchor="middle">deterministic · zero-dependency</text>
  </g>

  <path d="M778 161 L 822 161" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arr3)"/>

  <!-- step 4 -->
  <g>
    <rect x="832" y="86" width="196" height="150" rx="16" fill="url(#stepg)" stroke="#2d5a8a" stroke-width="1.5"/>
    <circle cx="930" cy="124" r="24" fill="#132a44" stroke="#fbbf24" stroke-width="2"/>
    <text x="930" y="131" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle">4</text>
    <text x="930" y="180" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="middle">Instantiate</text>
    <text x="930" y="204" font-size="14" fill="#94a3b8" text-anchor="middle">model fills every token</text>
    <text x="930" y="222" font-size="13.5" fill="#64748b" text-anchor="middle">no placeholders may ship</text>
  </g>

  <path d="M1038 161 L 1082 161" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arr3)"/>

  <!-- step 5 -->
  <g>
    <rect x="1092" y="86" width="180" height="150" rx="16" fill="url(#stepg)" stroke="#f472b6" stroke-width="2"/>
    <circle cx="1182" cy="124" r="24" fill="#132a44" stroke="#f472b6" stroke-width="2"/>
    <text x="1182" y="131" font-size="22" font-weight="800" fill="#f472b6" text-anchor="middle">5</text>
    <text x="1182" y="180" font-size="19" font-weight="700" fill="#e2e8f0" text-anchor="middle">Verify</text>
    <text x="1182" y="204" font-size="14" fill="#94a3b8" text-anchor="middle">gates green · hooks live</text>
    <text x="1182" y="222" font-size="13.5" fill="#64748b" text-anchor="middle">you review, then commit</text>
  </g>

  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="600" y="280" font-size="15" fill="#64748b" text-anchor="middle">Re-run any time to upgrade: untouched files refresh, your edits survive, extension packs stay opt-in.</text>
</svg>
