<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Five layers of repository governance and an upgrade channel</title>
  <desc id="desc">Resident instructions, deterministic gates, a decision log, in-repo skills, and process memory connect to a safe re-run upgrade channel.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; }
    .title { font-size: 38px; font-weight: 750; letter-spacing: -1.2px; }
    .layer { font-size: 15px; font-weight: 750; letter-spacing: 1.2px; }
    .name { font-size: 21px; font-weight: 700; }
    .copy { font-size: 16px; }
    .path { font-size: 14px; font-weight: 650; }
  </style>

  <rect width="1200" height="660" fill="#070d0f"/>
  <path d="M0 0H1200V8H0Z" fill="#9bd86b"/>

  <text x="64" y="66" class="eyebrow" fill="#9bd86b">SYSTEM MAP / 05 LAYERS</text>
  <text x="64" y="112" class="title" fill="#f4f6ec">Governance that lives with the code.</text>
  <text x="1136" y="88" text-anchor="end" class="copy" fill="#7f8d86">mechanical, discoverable, durable</text>

  <line x1="117" y1="172" x2="117" y2="512" stroke="#33423d" stroke-width="2"/>

  <g>
    <line x1="64" y1="152" x2="1136" y2="152" stroke="#26332f"/>
    <circle cx="117" cy="187" r="8" fill="#9bd86b"/>
    <text x="64" y="192" class="layer mono" fill="#9bd86b">L0</text>
    <text x="164" y="187" class="name" fill="#f4f6ec">Resident instructions</text>
    <text x="472" y="187" class="copy" fill="#9aa69f">Standing orders every agent session can discover.</text>
    <text x="1136" y="187" text-anchor="end" class="path mono" fill="#62c7d8">AGENTS.md</text>
  </g>

  <g>
    <line x1="64" y1="222" x2="1136" y2="222" stroke="#26332f"/>
    <circle cx="117" cy="257" r="8" fill="#62c7d8"/>
    <text x="64" y="262" class="layer mono" fill="#62c7d8">L1</text>
    <text x="164" y="257" class="name" fill="#f4f6ec">Deterministic gates</text>
    <text x="472" y="257" class="copy" fill="#9aa69f">Decisions, links, placeholders &amp; manifest verified before commit.</text>
    <text x="1136" y="257" text-anchor="end" class="path mono" fill="#62c7d8">scripts/verify-*</text>
  </g>

  <g>
    <line x1="64" y1="292" x2="1136" y2="292" stroke="#26332f"/>
    <circle cx="117" cy="327" r="8" fill="#e9e4d5"/>
    <text x="64" y="332" class="layer mono" fill="#e9e4d5">L2</text>
    <text x="164" y="327" class="name" fill="#f4f6ec">Unified decision log</text>
    <text x="472" y="327" class="copy" fill="#9aa69f">MADR records preserve rationale and explicit succession.</text>
    <text x="1136" y="327" text-anchor="end" class="path mono" fill="#62c7d8">docs/decisions/</text>
  </g>

  <g>
    <line x1="64" y1="362" x2="1136" y2="362" stroke="#26332f"/>
    <circle cx="117" cy="397" r="8" fill="#9bd86b"/>
    <text x="64" y="402" class="layer mono" fill="#9bd86b">L3</text>
    <text x="164" y="397" class="name" fill="#f4f6ec">In-repo skills</text>
    <text x="472" y="397" class="copy" fill="#9aa69f">Review and decision procedures live beside the code.</text>
    <text x="1136" y="397" text-anchor="end" class="path mono" fill="#62c7d8">.agents/skills/</text>
  </g>

  <g>
    <line x1="64" y1="432" x2="1136" y2="432" stroke="#26332f"/>
    <circle cx="117" cy="467" r="8" fill="#62c7d8"/>
    <text x="64" y="472" class="layer mono" fill="#62c7d8">L4</text>
    <text x="164" y="467" class="name" fill="#f4f6ec">Process memory</text>
    <text x="472" y="467" class="copy" fill="#9aa69f">Tests, postmortems &amp; PR policy outlive the session.</text>
    <text x="1136" y="467" text-anchor="end" class="path mono" fill="#62c7d8">docs/</text>
    <line x1="64" y1="502" x2="1136" y2="502" stroke="#26332f"/>
  </g>

  <path d="M117 512V565H164" fill="none" stroke="#9bd86b" stroke-width="2"/>
  <rect x="164" y="540" width="972" height="74" rx="4" fill="#101a18" stroke="#33423d"/>
  <rect x="164" y="540" width="8" height="74" fill="#9bd86b"/>
  <text x="198" y="570" class="eyebrow" fill="#9bd86b">UPGRADE CHANNEL</text>
  <text x="198" y="596" class="copy" fill="#d9ded5">Re-run repo-seed  ·  untouched files refresh  ·  user edits survive</text>
  <text x="1106" y="584" text-anchor="end" class="path mono" fill="#62c7d8">.repo-seed/manifest.json</text>
</svg>
